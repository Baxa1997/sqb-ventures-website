services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_FOUNDER_ACCOUNT_URL: ${NEXT_PUBLIC_FOUNDER_ACCOUNT_URL:-/account/login}
    ports:
      - '3000:3000'
    restart: unless-stopped
